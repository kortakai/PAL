<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Aethro Launcher</title>
    <style>
      body {
        background:
          linear-gradient(90deg, rgba(5, 12, 15, 0.94), rgba(9, 15, 19, 0.54)),
          url('/images/play-aethro-hero.png') center / cover no-repeat,
          #071014;
        color: #fff1c0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      #root:empty {
        display: grid;
        min-height: 100vh;
        place-items: center start;
        padding-left: 64px;
      }

      #root:empty::before {
        content: "PLAY AETHRO";
        display: grid;
        place-items: center;
        width: 164px;
        height: 164px;
        border: 2px solid rgba(255, 211, 110, 0.7);
        border-radius: 50%;
        background: rgba(15, 23, 20, 0.78);
        box-shadow: 0 0 0 12px rgba(255, 211, 110, 0.08), 0 28px 80px rgba(0,0,0,.45);
        color: #ffd36e;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
