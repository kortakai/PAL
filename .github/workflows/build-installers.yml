name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    name: ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: Windows
            platform: windows-latest
            args: ''
            rust-targets: ''
          - label: Linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache Tauri Windows bundle tools
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: windows-tauri-tools-nsis-3.11-nsis-utils-0.5.3

      - name: Install frontend dependencies
        run: npm install

      - name: Warm Windows NSIS toolchain
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tauriToolsDir = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsisDir = Join-Path $tauriToolsDir 'NSIS'
          $nsisZipUrl = 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'
          $nsisZipSha1 = 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D'
          $nsisUtilsUrl = 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll'
          $nsisUtilsSha1 = '75197FEE3C6A814FE035788D1C34EAD39349B860'
          $makensisPath = Join-Path $nsisDir 'makensis.exe'
          $utilsDir = Join-Path $nsisDir 'Plugins\x86-unicode\additional'
          $utilsPath = Join-Path $utilsDir 'nsis_tauri_utils.dll'
          $requiredNsisPaths = @(
            'makensis.exe',
            'Bin/makensis.exe',
            'Stubs/lzma-x86-unicode',
            'Stubs/lzma_solid-x86-unicode',
            'Include/MUI2.nsh',
            'Include/FileFunc.nsh',
            'Include/x64.nsh',
            'Include/nsDialogs.nsh',
            'Include/WinMessages.nsh',
            'Include/Win/COM.nsh',
            'Include/Win/Propkey.nsh',
            'Include/Win/RestartManager.nsh'
          )

          function Get-Sha1([string] $Path) {
            return (Get-FileHash -Path $Path -Algorithm SHA1).Hash.ToUpperInvariant()
          }

          function Download-WithRetry([string] $Url, [string] $Destination) {
            $attempts = 5
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $Destination
                return
              } catch {
                if ($attempt -eq $attempts) {
                  throw
                }
                Write-Host "Download failed for $Url on attempt $attempt/$attempts. Retrying in 15 seconds..."
                Start-Sleep -Seconds 15
              }
            }
          }

          New-Item -ItemType Directory -Path $tauriToolsDir -Force | Out-Null

          $needsNsisZip = -not (Test-Path $nsisDir)
          if (-not $needsNsisZip) {
            foreach ($relativePath in $requiredNsisPaths) {
              if (-not (Test-Path (Join-Path $nsisDir $relativePath))) {
                $needsNsisZip = $true
                break
              }
            }
          }

          if ($needsNsisZip) {
            $zipPath = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            $extractDir = Join-Path $env:RUNNER_TEMP 'nsis-3.11'

            if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
            }

            if (Test-Path $extractDir) {
              Remove-Item $extractDir -Recurse -Force
            }

            if (Test-Path $nsisDir) {
              Remove-Item $nsisDir -Recurse -Force
            }

            Download-WithRetry $nsisZipUrl $zipPath

            if ((Get-Sha1 $zipPath) -ne $nsisZipSha1) {
              throw "NSIS zip hash mismatch after download."
            }

            Expand-Archive -Path $zipPath -DestinationPath $env:RUNNER_TEMP -Force
            Move-Item -Path $extractDir -Destination $nsisDir
          }

          New-Item -ItemType Directory -Path $utilsDir -Force | Out-Null

          if (-not (Test-Path $utilsPath) -or (Get-Sha1 $utilsPath) -ne $nsisUtilsSha1) {
            $dllTempPath = Join-Path $env:RUNNER_TEMP 'nsis_tauri_utils.dll'

            if (Test-Path $dllTempPath) {
              Remove-Item $dllTempPath -Force
            }

            Download-WithRetry $nsisUtilsUrl $dllTempPath

            if ((Get-Sha1 $dllTempPath) -ne $nsisUtilsSha1) {
              throw "NSIS utils DLL hash mismatch after download."
            }

            Move-Item -Path $dllTempPath -Destination $utilsPath -Force
          }

          Write-Host "Tauri NSIS toolchain is ready at $nsisDir"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          tagName: app-v__VERSION__
          releaseName: Play Aethro Launcher v__VERSION__
          releaseBody: Play Aethro Launcher build. Download the installer for your operating system from the assets below.
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch].[ext]'
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'

  repair-updater-json:
    name: Repair updater JSON
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Rebuild latest.json with every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#app-v}"
          WORK_DIR="$(mktemp -d)"
          cd "$WORK_DIR"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json publishedAt,assets \
            > release.json
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig' \
            --dir sigs \
            --clobber

          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const version = process.env.VERSION;
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const byName = new Map(release.assets.map((asset) => [asset.name, asset]));
          const sigDir = 'sigs';

          function signature(name) {
            return fs.readFileSync(path.join(sigDir, `${name}.sig`), 'utf8').trim();
          }

          function assetUrl(name) {
            const asset = byName.get(name);
            if (!asset) {
              throw new Error(`Missing release asset ${name}`);
            }
            return asset.apiUrl;
          }

          function platform(name) {
            return {
              signature: signature(name),
              url: assetUrl(name)
            };
          }

          const darwinX64 = `Play.Aethro.Launcher_${version}_darwin_x64.app.tar.gz`;
          const darwinArm = `Play.Aethro.Launcher_${version}_darwin_aarch64.app.tar.gz`;
          const linuxAppImage = `Play.Aethro.Launcher_${version}_linux_amd64.AppImage`;
          const linuxDeb = `Play.Aethro.Launcher_${version}_linux_amd64.deb`;
          const linuxRpm = `Play.Aethro.Launcher_${version}_linux_x86_64.rpm`;
          const windowsMsi = `Play.Aethro.Launcher_${version}_windows_x64.msi`;
          const windowsNsis = `Play.Aethro.Launcher_${version}_windows_x64.exe`;

          const latest = {
            version,
            notes: 'Play Aethro Launcher build. Download the installer for your operating system from the assets below.',
            pub_date: release.publishedAt,
            platforms: {
              'darwin-x86_64': platform(darwinX64),
              'darwin-x86_64-app': platform(darwinX64),
              'darwin-aarch64': platform(darwinArm),
              'darwin-aarch64-app': platform(darwinArm),
              'linux-x86_64': platform(linuxAppImage),
              'linux-x86_64-appimage': platform(linuxAppImage),
              'linux-x86_64-deb': platform(linuxDeb),
              'linux-x86_64-rpm': platform(linuxRpm),
              'windows-x86_64': platform(windowsMsi),
              'windows-x86_64-msi': platform(windowsMsi),
              'windows-x86_64-nsis': platform(windowsNsis)
            }
          };

          fs.writeFileSync('latest.json', `${JSON.stringify(latest, null, 2)}\n`);
          NODE

          gh release delete-asset "$TAG" latest.json \
            --repo "$GITHUB_REPOSITORY" \
            -y || true
          gh release upload "$TAG" latest.json \
            --repo "$GITHUB_REPOSITORY"
